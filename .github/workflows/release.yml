# Builds and tests grace9000 on every system it runs on: macOS (one
# universal app, also run on an Intel Mac), Windows (x64 and Arm) and Linux
# (x64 and Arm). Every machine runs the tests with ffmpeg installed, so every
# photo format it can write is opened back, and a real export runs on each.
# Then each download is unpacked: its built-in adapters (Camera Raw, JPEG XL)
# open the test photos through grace9000's own loader, and the app is started
# with a sample edit and a screenshot kept. Pushing a tag like v0.0.2 also
# publishes a GitHub release with every download, using
# docs/releases/<tag>.md as the notes; any other push runs the same checks
# without releasing, and a newer push cancels an older run of the same branch.
name: Release

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: write

env:
  # Tests that need ffmpeg or the built-in adapters fail, rather than skip.
  GRACE9000_REQUIRE_FFMPEG: "1"
  GRACE9000_REQUIRE_ADAPTERS: "1"

jobs:
  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target\nadapters/camera-raw -> target\nadapters/jpeg-xl -> target"
      - name: ffmpeg
        run: brew install ffmpeg
      - name: Test
        run: |
          for a in adapters/*/; do cargo test --release --manifest-path "$a/Cargo.toml"; cargo build --release --manifest-path "$a/Cargo.toml"; done
          cargo test
      - name: Package
        run: scripts/package.sh
      - name: Check the download and its built-in adapters
        run: |
          set -e
          rm -rf x && ditto -x -k dist/grace9000-*-macos-universal.zip x
          app=x/grace9000.app/Contents/MacOS/grace9000
          lipo -archs "$app" | grep -q x86_64
          lipo -archs "$app" | grep -q arm64
          codesign -v x/grace9000.app
          "$app" --version
          for a in camera-raw jpeg-xl; do lipo -archs "x/grace9000.app/Contents/Resources/adapters/$a/$a" | grep -q x86_64; done
          GRACE9000_BUILTIN_ADAPTERS=$PWD/x/grace9000.app/Contents/Resources/adapters cargo test adapter_tests
      - name: Screenshot with a sample edit
        timeout-minutes: 3
        run: |
          mkdir -p shots
          export GRACE9000_CONFIG_DIR=$(python3 scripts/sample.py sample | tail -1)
          x/grace9000.app/Contents/MacOS/grace9000 &
          pid=$!
          sleep 8
          kill -0 $pid
          screencapture -x shots/macos.png
          kill $pid
      - uses: actions/upload-artifact@v4
        with:
          name: grace9000-macos
          path: dist/*
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots-macos
          path: shots/

  # The universal download's Intel half, on an Intel Mac.
  intel:
    needs: mac
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: ffmpeg
        run: brew install ffmpeg
      - uses: actions/download-artifact@v4
        with:
          name: grace9000-macos
          path: dist
      - name: Test, built for Intel, with the download's adapters
        run: |
          set -e
          uname -m
          rm -rf x && ditto -x -k dist/grace9000-*-macos-universal.zip x
          arch -x86_64 x/grace9000.app/Contents/MacOS/grace9000 --version
          GRACE9000_BUILTIN_ADAPTERS=$PWD/x/grace9000.app/Contents/Resources/adapters cargo test

  windows:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, arch: x64, ffmpeg: win64 }
          - { os: windows-11-arm, arch: arm64, ffmpeg: winarm64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target\nadapters/camera-raw -> target\nadapters/jpeg-xl -> target"
      - name: ffmpeg (BtbN's builds, for this processor)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p ffmpeg && cd ffmpeg
          gh release download latest --repo BtbN/FFmpeg-Builds -p "ffmpeg-master-latest-${{ matrix.ffmpeg }}-gpl.zip"
          unzip -q ffmpeg-*.zip
          echo "$(cygpath -w "$(echo $PWD/ffmpeg-*/bin)")" >> "$GITHUB_PATH"
      - name: Test
        shell: bash
        run: |
          ffmpeg -version | head -1
          for a in adapters/*/; do cargo test --release --manifest-path "$a/Cargo.toml"; cargo build --release --manifest-path "$a/Cargo.toml"; done
          cargo test
      - name: Package
        shell: bash
        run: |
          scripts/package.sh
          # Every file named for this machine, or the release would mix them up.
          for f in dist/*; do case "$f" in *-${{ matrix.arch }}.*) ;; *) echo "::error::$f isn't named ${{ matrix.arch }}"; exit 1 ;; esac; done
      - name: Check the download and its built-in adapters
        shell: bash
        run: |
          set -e
          rm -rf x && mkdir x && cd x && unzip -q ../dist/grace9000-*-windows-*.zip
          ls -R
          ./grace9000.exe --version
          cd ..
          GRACE9000_BUILTIN_ADAPTERS="$(cygpath -w "$PWD/x/adapters")" cargo test adapter_tests
      # Arm runners sit on Windows' first-run privacy screen, over everything.
      - name: Screenshot with a sample edit
        if: matrix.arch == 'x64'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force shots | Out-Null
          $env:GRACE9000_CONFIG_DIR = (python scripts/sample.py sample | Select-Object -Last 1)
          $p = Start-Process -FilePath x\grace9000.exe -PassThru
          Start-Sleep 10
          if ($p.HasExited) { throw "grace9000 exited: $($p.ExitCode)" }
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $img = New-Object System.Drawing.Bitmap $b.Width, $b.Height
          $g = [System.Drawing.Graphics]::FromImage($img)
          $g.CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
          $img.Save("shots\windows-${{ matrix.arch }}.png")
          Stop-Process -Id $p.Id
          Get-ChildItem $env:GRACE9000_CONFIG_DIR
      - uses: actions/upload-artifact@v4
        with:
          name: grace9000-windows-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots-windows-${{ matrix.arch }}
          if-no-files-found: ignore
          path: shots/

  linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04, arch: x64, ffmpeg: linux64 }
          - { os: ubuntu-22.04-arm, arch: arm64, ffmpeg: linuxarm64 }
    runs-on: ${{ matrix.os }}   # an older glibc, so it runs on more distros
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target\nadapters/camera-raw -> target\nadapters/jpeg-xl -> target"
      - name: Dependencies
        run: |
          sudo apt-get update
          # A screen to run on, and what the screenshot and menu checks use.
          sudo apt-get install -y pkg-config libxkbcommon-x11-0 xvfb openbox imagemagick xdotool desktop-file-utils
      # Ubuntu 22.04's own ffmpeg is 4.4, too old to write several of the
      # formats the tests open back; BtbN's is current.
      - name: ffmpeg (BtbN's builds, for this processor)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p ffmpeg && cd ffmpeg
          gh release download latest --repo BtbN/FFmpeg-Builds -p "ffmpeg-master-latest-${{ matrix.ffmpeg }}-gpl.tar.xz"
          tar xf ffmpeg-*.tar.xz
          echo "$(echo $PWD/ffmpeg-*/bin)" >> "$GITHUB_PATH"
      - name: Test
        run: |
          ffmpeg -version | head -1
          for a in adapters/*/; do cargo test --release --manifest-path "$a/Cargo.toml"; cargo build --release --manifest-path "$a/Cargo.toml"; done
          cargo test
      - name: Package
        run: |
          scripts/package.sh
          for f in dist/*; do case "$f" in *-${{ matrix.arch }}.*) ;; *) echo "::error::$f isn't named ${{ matrix.arch }}"; exit 1 ;; esac; done
      - name: Check the download, its built-in adapters and its app menu entry
        run: |
          set -e
          mkdir -p x && tar xzf dist/grace9000-*-linux-*.tar.gz -C x
          app=$(echo x/grace9000-*/grace9000)
          "$app" --version
          GRACE9000_BUILTIN_ADAPTERS=$(echo $PWD/x/grace9000-*/adapters) cargo test adapter_tests
          export HOME=$PWD/home XDG_DATA_HOME=$PWD/home/.local/share
          mkdir -p "$HOME"
          x/grace9000-*/install.sh
          desktop-file-validate "$XDG_DATA_HOME/applications/grace9000.desktop"
          test -f "$XDG_DATA_HOME/icons/hicolor/256x256/apps/grace9000.png"
          exe=$(sed -n 's/^Exec="\(.*\)" %f$/\1/p' "$XDG_DATA_HOME/applications/grace9000.desktop")
          "$exe" --version
          x/grace9000-*/install.sh --remove
          test ! -e "$XDG_DATA_HOME/applications/grace9000.desktop"
      - name: Screenshot with a sample edit
        timeout-minutes: 3
        run: |
          mkdir -p shots
          export DISPLAY=:99 GRACE9000_CONFIG_DIR=$(python3 scripts/sample.py sample | tail -1)
          Xvfb :99 -screen 0 1440x900x24 &
          sleep 2
          openbox &
          sleep 1
          app=$(echo x/grace9000-*/grace9000)
          "$app" &
          pid=$!
          # Wait for the window itself, not a fixed time.
          for i in $(seq 60); do
            xdotool search --onlyvisible --name grace9000 >/dev/null && break
            kill -0 $pid
            sleep 0.5
          done
          xdotool search --onlyvisible --name grace9000 || { echo "::error::no grace9000 window after 30 s"; exit 1; }
          echo "window after $i tries"
          sleep 4
          import -window root "shots/linux-${{ matrix.arch }}.png"
          kill $pid
      - uses: actions/upload-artifact@v4
        with:
          name: grace9000-linux-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots-linux-${{ matrix.arch }}
          path: shots/

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [mac, intel, windows, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: grace9000-*
      - name: Gather, refusing two files with the same name
        run: |
          mkdir out
          for f in dist/*/*; do
            [ -e "out/${f##*/}" ] && { echo "::error::two builds made ${f##*/}"; exit 1; }
            mv "$f" out/
          done
          ls -l out
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          notes="docs/releases/${tag}.md"
          if [ -f "$notes" ]; then set -- --notes-file "$notes"; else set -- --generate-notes; fi
          gh release create "$tag" out/* --title "grace9000 ${tag#v}" "$@"
